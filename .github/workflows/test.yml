name: Test Backend

on:
  push:
    branches: [ main, dev ] # Test on pushes to main and dev branches
  pull_request:
    branches: [ main ] # Test on pull requests targeting the main branch

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.15.0'  

    - name: Install dependencies
      run: npm install

    - name: Run tests
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: npm run test  
      working-directory: ./backend