components:
  schemas:
    CourseInput:
      type: object
      required:
        - title
        - teacherId
      properties:
        title:
          type: string
          description: The name of the course.
          example: "Introduction to Programming"
        description:
          type: string
          description: A brief description of the course.
          example: "This course covers the basics of programming using Python."
        category:
          type: string
          description: The category of the course.
          example: "Computer Science"
        isActive:
          type: boolean
          description: Indicates if the course is active.
          default: false
        maxStudents:
          type: integer
          description: The maximum number of students allowed in the course.
          default: 30
        teacherId:
          type: ObjectId
          description: The instructor ID of the course.
          example: '68e283a0d9eaff29b0c84535'
