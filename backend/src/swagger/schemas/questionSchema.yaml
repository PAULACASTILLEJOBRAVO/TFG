components:
  schemas:
    Question:
      type: object
      required:
        - text
        - type
        - options
        - correctOptions
      properties:
        _id:
          type: ObjectId
          description: Unique identifier for the question.
          example: "64f0c8e2b4d1c2a5f6e7d8c9"
        text:
          type: string
          description: The text of the question.
          example: "Which of the following data structures uses the LIFO principle?"
        type:
          type: string
          enum: [multiple-choice, true-false]
          description: The type of the question.
          example: "multiple-choice"
        options:
          type: array
          description: List of possible options for the question.
          items:
            type: object
            required:
              - text
              - isCorrect
              - order
            properties:
              text:
                type: string
                description: Visible text of the option.
                example: "Stack"
              isCorrect:
                type: boolean
                description: Indicates if the option is correct.
                example: true
              order:
                type: integer
                description: The order of the option in the list.
                example: 0
              feedback:
                type: string
                description: Optional feedback for this option.
                example: "Correct! A stack follows the LIFO (Last In, First Out) principle."
        correctOptions:
          type: integer
          description: Index of the correct answer to the question.
          example: 0
        points:
          type: integer
          description: Number of points awarded for a correct answer.
          example: 5
        timeLimit:
          type: integer
          description: Time limit to answer the question in seconds.
          example: 30
        isActive:
          type: boolean
          description: Indicates if the question is currently active.
          example: true
        isReusable:
          type: boolean
          description: Indicates if the question can be reused in other quizzes.
          example: false
        allowMultipleAttempts:
          type: boolean
          description: Indicates if multiple options can be selected for this question.
          example: false
        createdAt:
          type: date-time
          description: Timestamp when the question was created.
          example: "2023-10-01T12:00:00Z"
        updatedAt:
          type: date-time
          description: Timestamp when the question was last updated.
          example: "2023-10-01T12:00:00Z"