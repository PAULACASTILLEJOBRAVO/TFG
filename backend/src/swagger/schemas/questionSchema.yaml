components:
  schemas:
    Question:
      type: object
      required:
        - text
        - type
        - options
      properties:
        _id:
          type: ObjectId
          description: Unique identifier for the question.
          example: "64f0c8e2b4d1c2a5f6e7d8c9"
        text:
          type: string
          description: The text of the question.
          example: "Which of the following data structures uses the LIFO principle?"
        type:
          type: string
          enum: [multiple-choice, true-false]
          description: The type of the question.
          example: "multiple-choice"
        options:
          type: array
          description: List of possible options for the question.
          items:
            type: object
            required:
              - text
              - isCorrect
              - letter
            properties:
              text:
                type: string
                description: Visible text of the option.
                example: "Stack"
              isCorrect:
                type: boolean
                description: Indicates if the option is correct.
                example: true
              letter:
                type: string
                description: The letter assigned to the option.
                example: "A"
        points:
          type: integer
          description: Number of points awarded for a correct answer.
          example: 5
        timeLimit:
          type: integer
          description: Time limit to answer the question in seconds.
          example: 30
        createdAt:
          type: date-time
          description: Timestamp when the question was created.
          example: "2023-10-01T12:00:00Z"
        updatedAt:
          type: date-time
          description: Timestamp when the question was last updated.
          example: "2023-10-01T12:00:00Z"
        