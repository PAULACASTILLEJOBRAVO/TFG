components:
  schemas:
    QuizInput:
      type: object
      required:
        - title
        - creatorId
      properties:
        title:
          type: string
          description: The title of the quiz.
          example: "Midterm Exam - Module 1"
        description:
          type: string
          description: A brief description of the quiz.
          example: "This quiz covers topics from chapters 1 to 5."
        difficulty:
          type: enum
          description: The difficulty level of the quiz.
          enum: [Easy, Medium, Hard]
          default: "Medium"
        isActive:
          type: boolean
          description: Indicates if the quiz is active.
          default: false
        isPublic:
          type: string
          enum: [public, private]
          description: Indicates if the quiz is public.
          default: private
        creatorId:
          type: ObjectId
          description: The user ID who created the quiz.
          example: '64a7f0c2e4b0c8b1a1e4d3f2'