components:
  schemas:
    ResultInput:
      type: object
      required:
        - totalScore
        - correctAnswers
        - wrongAnswers
        - unansweredAnswers
        - totalQuestions
        - rank
        - playerId
        - sessionId
        - quizId
      properties:
        totalScore:
          type: number
          description: Total score obtained by the player.
          example: 85
        correctAnswers:
          type: integer
          description: Number of correct answers given by the player.
          example: 17
        wrongAnswers:
          type: integer
          description: Number of wrong answers given by the player.
          example: 3
        unansweredAnswers:
          type: integer
          description: Number of unanswered questions.
          example: 0
        totalQuestions:
          type: integer
          description: Total number of questions in the quiz.
          example: 20
        rank:
          type: integer
          description: Player's rank in the session.
          example: 2
        status:
          type: enum
          enum: ["completed", "in-progress"]
          description: Status of the result (e.g., "completed", "in-progress").
          default: "in-progress"
        timeTaken:
          type: integer
          description: Time taken to complete the quiz in seconds.
          example: 300
        playerId:
          type: objectId
          description: Unique identifier of the player.
          example: '68e28135fe97fd5d3f0cc3a4'
        sessionId:
          type: objectId
          description: Unique identifier of the game session.
          example: '64f0c8e2b4d1c2a5f6e7d8c9'
        quizId:
          type: objectId
          description: Unique identifier of the quiz.
          example: '63a7f0c2e4b0c8b1a1e4d3f3'