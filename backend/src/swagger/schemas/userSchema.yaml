components:
  schemas:
    User:
      type: object
      required:
        - username
        - password
        - email
      properties:
        _id:
          type: ObjectId
          description: The user ID.
          example: "64a7f0c2e4b0c8b1a1e4d3f2"
        username:
          type: string
          description: The username of the user.
          example: "John Doe"
        email:
          type: string
          description: The email of the user.
          format: email
          example: "John.Doe@gmail.com"
        password:
          type: string
          description: The password of the user.
          format: password
        role:
          type: string
          description: The role of the user.
          enum: [student, teacher, admin]
          example: "student"
        fullname:
          type: string
          description: The full name of the user.
          example: "Johnathan Doe"
        isActive:
          type: boolean
          description: Indicates if the user is active.
          example: true
        isDeleted:
          type: boolean
          description: Indicates if the user is deleted.
          example: false
        deletedBy:
          type: string
          description: The identifier of the user who deleted this user.
          example: "64a7f0c2e4b0c8b1a1e4d3f2"
        deleteReason:
          type: string
          description: The reason for deleting the user.
          example: "User requested account deletion."
        createdAt:
          type: date-time
          description: The date and time when the user was created.
          example: "2023-07-01T12:00:00Z"
        updatedAt:
          type: date-time
          description: The date and time when the user was last updated.
          example: "2023-07-15T12:00:00Z"
        deletedAt:
          type: date-time
          description: The date and time when the user was deleted.
          example: "2023-07-20T12:00:00Z"
        lastLoginAt:
          type: date-time
          description: The date and time when the user last logged in.
          example: "2023-07-18T08:30:00Z"